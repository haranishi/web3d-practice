<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>練習01 — シェーダーグラデ・ヒーロー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #05030a; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; pointer-events: none;
    color: #fff; text-align: center;
    font-family: -apple-system, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .overlay h1 {
    font-size: clamp(2.2rem, 9vw, 7rem); font-weight: 800;
    letter-spacing: -0.04em; line-height: 0.95; mix-blend-mode: overlay;
  }
  .overlay p { margin-top: 1.2rem; font-size: clamp(.85rem, 2vw, 1.05rem); opacity: .75; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay">
  <h1>LILAC<br />STUDIO</h1>
  <p>マウスを動かしてみてください</p>
</div>

<!-- Three.js をCDNから（ビルド不要・このファイルを開くだけで動く） -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three'

const app = document.getElementById('app')
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches // a11y: 動きを止める設定

// --- レンダラー（色管理。詳細は 08ノート）---
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)) // モバイル負荷対策（2で頭打ち）
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.NoToneMapping // 2DフラットグラデなのでトーンマップOFF
app.appendChild(renderer.domElement)

const scene = new THREE.Scene()
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1) // 全画面板用

const uniforms = {
  uTime:  { value: 0 },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uRes:   { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
}

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position, 1.0); } // 板を画面いっぱいに
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2  uMouse;
    uniform vec2  uRes;

    /* ===== Simplex noise 3D (Ashima / Stefan Gustavson) ===== */
    vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
    vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod(i, 289.0);
      vec4 p = permute(permute(permute(
                 i.z + vec4(0.0, i1.z, i2.z, 1.0))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0))
               + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 1.0/7.0;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    /* fbm = ノイズの重ね合わせ（質感の土台。07ノート参照） */
    float fbm(vec3 p){
      float v = 0.0, a = 0.5;
      for(int i=0;i<5;i++){ v += a*snoise(p); p *= 2.0; a *= 0.5; }
      return v;
    }

    /* cosine palette (Inigo Quilez) — 配色はここの d を触ると激変する */
    vec3 palette(float t){
      vec3 a = vec3(0.5);
      vec3 b = vec3(0.5);
      vec3 c = vec3(1.0);
      vec3 d = vec3(0.30, 0.20, 0.55); // ライラック寄りの紫
      return a + b*cos(6.28318*(c*t + d));
    }

    void main(){
      vec2 uv = vUv;
      uv.x *= uRes.x / uRes.y;          // アスペクト補正
      vec2 m = (uMouse - 0.5);

      float t = uTime * 0.08;
      vec3 p = vec3(uv*1.5 + m*0.6, t);  // マウスで流れの中心をずらす
      float n = fbm(p);
      n += 0.4 * fbm(p*2.0 + n);          // 2層目でうねりを足す

      vec3 col = palette(n*0.5 + 0.5 + t*0.2);
      float vig = smoothstep(1.2, 0.2, length(vUv - 0.5)); // 周辺減光で締める
      col *= mix(0.7, 1.0, vig);
      float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.04;        // 微粒子グレイン（バンディング防止）

      gl_FragColor = vec4(col, 1.0);
    }
  `,
})

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material))

// マウス（慣性つき。Lenis的な滑らかさ。02ノート参照）
const targetMouse = new THREE.Vector2(0.5, 0.5)
window.addEventListener('pointermove', (e) => {
  targetMouse.set(e.clientX / window.innerWidth, 1.0 - e.clientY / window.innerHeight)
})

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight)
  uniforms.uRes.value.set(window.innerWidth, window.innerHeight)
})

const clock = new THREE.Clock()
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta()
  if (!reduce) uniforms.uTime.value += dt        // reduced-motionなら時間を止める
  uniforms.uMouse.value.lerp(targetMouse, 0.05)  // 滑らかに追従
  renderer.render(scene, camera)
})
</script>
</body>
</html>
